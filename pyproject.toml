[project]
name = "openjames"
version = "0.1.0"
description = "Open-source, self-extending personal AI assistant that talks to you over your own chat channels."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0", "playwright>=1.40", "websockets>=12"]

[project.scripts]
openjames = "openjames.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjames"]
